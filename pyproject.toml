[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pl-holidays-mcp"
version = "0.1.0"
description = "Local MCP server for Polish public holidays and business-day math."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bartosz Kuć", email = "firma@bartosza.pl" }]
keywords = ["mcp", "holidays", "poland", "business-days"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/bartosz-kuc/pl-holidays-mcp"
Repository = "https://github.com/bartosz-kuc/pl-holidays-mcp"
Issues = "https://github.com/bartosz-kuc/pl-holidays-mcp/issues"

[project.scripts]
pl-holidays-mcp = "pl_holidays_mcp:sync_main"

[tool.hatch.build.targets.wheel]
sources = ["."]
only-include = ["server.py"]

[tool.hatch.build.targets.wheel.force-include]
"server.py" = "pl_holidays_mcp.py"

[tool.hatch.build.targets.sdist]
include = ["server.py", "README.md", "LICENSE", "SECURITY.md", "pyproject.toml"]
